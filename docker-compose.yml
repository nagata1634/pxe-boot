# PXE ブートサーバー（QNAP NAS 用）。ルータの DHCP は変更せず、dnsmasq を proxyDHCP モードで動かして
# 「PXE のブート情報だけ」を追加配布する。UEFI クライアント向けに shim/grub を tftp で配り、
# インストーラ本体(stage2)・ostree リポジトリ・Kickstart は nginx(HTTP) で配る。
#
#   .env を用意（.env.example 参照）→ ./setup-iso.sh <Kinoite ISO> → docker compose up -d
#
# 両サービスとも network_mode: host 必須（proxyDHCP はブロードキャストを受ける必要がある）。
services:
  dnsmasq:
    image: docker.io/library/alpine:3.20
    container_name: pxe-dnsmasq
    network_mode: host
    cap_add: [NET_ADMIN, NET_BIND_SERVICE]
    restart: unless-stopped
    volumes:
      - ./tftp:/tftp:ro
      - ./dnsmasq.conf.tmpl:/etc/dnsmasq.conf.tmpl:ro
    environment:
      - LAN_SUBNET=${LAN_SUBNET:?}
      - NAS_HOST=${NAS_HOST:?}
      - PXE_IFACE=${PXE_IFACE:-}
    command: >
      sh -c "apk add --no-cache dnsmasq >/dev/null &&
             sed -e \"s|@LAN_SUBNET@|$$LAN_SUBNET|g\" -e \"s|@NAS_HOST@|$$NAS_HOST|g\"
                 -e \"s|@IFACE_LINE@|$${PXE_IFACE:+interface=$$PXE_IFACE}|\" /etc/dnsmasq.conf.tmpl > /etc/dnsmasq.conf &&
             exec dnsmasq --no-daemon --conf-file=/etc/dnsmasq.conf --log-dhcp"
  http:
    image: docker.io/library/nginx:1.27-alpine
    container_name: pxe-http
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./http:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
